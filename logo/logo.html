<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Monoton&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:transparent}
svg{display:block}
</style></head>
<body>
<svg id="logo" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12052b"/>
      <stop offset="0.45" stop-color="#3a0b5c"/>
      <stop offset="0.72" stop-color="#b3186b"/>
      <stop offset="1" stop-color="#ff6a3d"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe259"/>
      <stop offset="0.55" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff2d8a"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ffd1f0"/>
      <stop offset="0.5" stop-color="#ff4fb8"/>
      <stop offset="1" stop-color="#ff9a3d"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0a4a"/>
      <stop offset="1" stop-color="#0b0220"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="512" cy="512" r="512"/></clipPath>
    <clipPath id="sunclip">
      <rect x="0" y="0" width="1024" height="470"/>
      <rect x="0" y="482" width="1024" height="16"/>
      <rect x="0" y="512" width="1024" height="12"/>
      <rect x="0" y="536" width="1024" height="9"/>
      <rect x="0" y="556" width="1024" height="6"/>
    </clipPath>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sunglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <g clip-path="url(#circle)">
    <rect width="1024" height="1024" fill="url(#sky)"/>
    <!-- stars -->
    <g fill="#fff" opacity="0.8">
      <circle cx="180" cy="190" r="3"/><circle cx="300" cy="120" r="2"/><circle cx="760" cy="150" r="3"/>
      <circle cx="860" cy="250" r="2"/><circle cx="640" cy="90" r="2"/><circle cx="420" cy="210" r="2"/>
      <circle cx="120" cy="330" r="2"/><circle cx="900" cy="380" r="2"/>
    </g>
    <!-- sun -->
    <circle cx="512" cy="430" r="230" fill="#ff4f8a" opacity="0.55" filter="url(#sunglow)"/>
    <g clip-path="url(#sunclip)">
      <circle cx="512" cy="430" r="200" fill="url(#sun)"/>
    </g>
    <!-- sea -->
    <rect x="0" y="575" width="1024" height="449" fill="url(#sea)"/>
    <g stroke="#ff4fb8" stroke-opacity="0.55" stroke-width="3">
      <line x1="300" y1="600" x2="724" y2="600"/>
      <line x1="340" y1="625" x2="684" y2="625" stroke-opacity="0.4"/>
      <line x1="380" y1="650" x2="644" y2="650" stroke-opacity="0.3"/>
    </g>
    <!-- palms -->
    <g fill="#0b0220">
      <path d="M205 600 C 210 500, 235 420, 275 360 L 285 366 C 250 425, 228 505, 225 600 Z"/>
      <path d="M278 362 C 230 330, 170 330, 120 360 C 170 345, 220 350, 270 372 Z"/>
      <path d="M278 362 C 250 310, 200 290, 150 290 C 200 305, 240 330, 268 370 Z"/>
      <path d="M278 362 C 300 310, 350 290, 400 300 C 350 310, 310 335, 286 372 Z"/>
      <path d="M278 362 C 330 345, 380 360, 420 400 C 375 375, 330 368, 284 374 Z"/>
      <path d="M278 362 C 270 320, 280 280, 300 250 C 292 290, 290 325, 288 368 Z"/>

      <path d="M840 600 C 836 520, 815 460, 785 410 L 776 416 C 803 465, 818 525, 820 600 Z"/>
      <path d="M782 412 C 820 385, 870 385, 910 410 C 870 398, 830 402, 790 422 Z"/>
      <path d="M782 412 C 800 370, 840 350, 880 352 C 842 365, 810 385, 788 420 Z"/>
      <path d="M782 412 C 760 370, 720 355, 680 362 C 720 372, 752 392, 776 422 Z"/>
      <path d="M782 412 C 740 400, 700 410, 668 440 C 705 422, 742 418, 778 424 Z"/>
    </g>

    <!-- wordmark -->
    <g transform="translate(512 740) skewX(-10)" text-anchor="middle"
       font-family="Anton, Impact, sans-serif" font-size="230" letter-spacing="6">
      <text y="0" fill="#ff2d8a" opacity="0.9" filter="url(#glow)">RAYNAX</text>
      <text y="0" fill="none" stroke="#1a0533" stroke-width="22" stroke-linejoin="round">RAYNAX</text>
      <text y="0" fill="url(#txt)" stroke="#fff" stroke-width="3">RAYNAX</text>
    </g>
  </g>
</svg>
</body></html>
